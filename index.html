<!DOCTYPE html>

<html>
<head>
<title>Cashbac</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial}
nav{display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 6%;
    background:white}
.logo{font-size:32px;
    font-weight:bold;
    color:#102344}
.logo span{color:#08a5eb}
.menu{display:flex;
    align-items:center;
    gap:25px;
    font-size:14px;
    font-weight:bold}
.btn{background:#0799e8;
    color:white;
    padding:15px;
    border-radius:30px}
.hero{background:#08a9ed;
    min-height:90vh;
    display:flex;
    align-items:center;
    padding:5%;
    color:white;
    gap:30px}
.text{width:60%}
h1{font-size:45px;
    margin-bottom:25px}
p{font-size:22px;
    line-height:1.5;
    margin-bottom:25px}
.store{width:145px;
    margin-right:10px}
.pic{width:40%}
.pic img{width:100%}
@media(max-width:700px){
nav,.menu{flex-wrap:wrap;
    gap:12px}
.hero{flex-direction:column}
.text,.pic{width:100%}
h1{font-size:32px}
p{font-size:18px}
}
</style>
</head>
<body>

<nav>
<div class="logo">◉ cash<span>bac</span></div>
<div class="menu">
<span>HOW IT WORKS</span>
<span>MERCHANTS</span>
<span>BLOG</span>
<span class="btn">PARTNER FOR BUSINESS</span>
</div>
</nav>

<div class="hero">
<div class="text">
<h1>Most effortless way to get instant Rewards. Anytime. Anywhere.</h1>
<p>Get instant rewards 24/7 for every transactions at your favorite merchants all around you with Cashbac app.</p>

<a href="https://play.google.com/store">
<img class="store" src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Google Play">
</a>

<a href="https://www.apple.com/app-store/">
<img class="store" src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="App Store">
</a>
</div>

<div class="pic">
<img src="https://clipart-library.com/2023/woman-cashier-supermarket_42515-330.jpg" alt="Customer and cashier">
</div>
</div>

</body>
</html>
